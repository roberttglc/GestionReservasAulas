<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reservas de aulas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main><h1>Reservas de aulas</h1>
    <p class="muted">Consulta las aulas disponibles y gestiona reservas del centro.</p>
    <section class="card"><h2>Consultar aulas</h2>
        <form id="filtro"><label>Capacidad mínima <input id="capacidad" type="number" min="0"></label><label><input
                id="ordenadores" type="checkbox"> Con ordenadores</label>
            <button>Buscar</button>
        </form>
    </section>
    <section class="card"><h2>Aulas</h2>
        <p id="estado" class="muted"></p>
        <div id="aulas" class="grid"></div>
    </section>
    <section class="card"><h2>Nueva reserva</h2>
        <form id="reserva"><label>Aula <select id="aula" required></select></label><label>Profesor <select id="profesor"
                                                                                                           required></select></label><label>Franja
            <select id="franja" required></select></label><label>Fecha <input id="fecha" type="date" required></label>
            <button>Reservar</button>
        </form>
        <p id="mensaje"></p></section>
</main>
<script src="app.js"></script>
</body>
</html>
